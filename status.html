<script>
  // Sets the correct lang/dir BEFORE the browser paints anything — without
  // this, a returning visitor who chose a non-Persian language would see
  // a jarring flash of Persian/RTL layout on every page load/refresh,
  // then a disruptive jump to their actual language once js/i18n.js loads
  // later in the page. Mirrors i18n.js's own RTL_LANGS list exactly.
  (function() {
    var lang = localStorage.getItem('fbb_lang') || 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = ['fa', 'ar', 'ku'].includes(lang) ? 'rtl' : 'ltr';
  })();
</script>

<script>
  function escStatus(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function T(dict) { return dict[localStorage.getItem('fbb_lang') || 'fa'] ?? dict.en; }
  const SEVERITY_LABELS = {
    info: {fa:'اطلاع‌رسانی', en:'Info', ar:'معلومات', tr:'Bilgi', ru:'Информация', es:'Información', ku:'زانیاری'},
    maintenance: {fa:'نگهداری', en:'Maintenance', ar:'صيانة', tr:'Bakım', ru:'Обслуживание', es:'Mantenimiento', ku:'چاککردنەوە'},
    incident: {fa:'حادثه', en:'Incident', ar:'حادث', tr:'Olay', ru:'Инцидент', es:'Incidente', ku:'ڕووداو'},
    resolved: {fa:'رفع‌شده', en:'Resolved', ar:'تم الحل', tr:'Çözüldü', ru:'Решено', es:'Resuelto', ku:'چارەسەرکراو'},
  };
  (async () => {
    const isFa = (localStorage.getItem('fbb_lang') || 'fa') === 'fa';
    const bannerEl = document.getElementById('statusBanner');
    const listEl = document.getElementById('announcementsList');
    try {
      const { healthy, announcements } = await apiGet('/status');
      bannerEl.className = 'status-banner ' + (healthy ? 'ok' : 'down');
      bannerEl.innerHTML = `<span class="status-dot"></span><span>${
        healthy ? T({fa:'همه‌چیز عادیه — سیستم در دسترسه', en:'All systems operational', ar:'كل الأنظمة تعمل بشكل طبيعي', tr:'Tüm sistemler çalışıyor', ru:'Все системы работают нормально', es:'Todos los sistemas operativos', ku:'هەموو سیستەمەکان کاردەکەن'}) : T({fa:'مشکلی در سرویس تشخیص داده شد', en:'A service issue has been detected', ar:'تم اكتشاف مشكلة في الخدمة', tr:'Bir hizmet sorunu tespit edildi', ru:'Обнаружена проблема с сервисом', es:'Se ha detectado un problema de servicio', ku:'کێشەیەک لە خزمەتگوزاری دۆزراوەتەوە'})
      }</span>`;

      listEl.innerHTML = announcements.length
        ? announcements.map(a => `
            <div class="announcement">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <strong>${escStatus(a.title)}</strong>
                <span class="badge ${escStatus(a.severity)}">${SEVERITY_LABELS[a.severity] ? T(SEVERITY_LABELS[a.severity]) : escStatus(a.severity)}</span>
              </div>
              <p style="color:var(--paper-dim); font-size:13.5px; margin-bottom:4px;">${escStatus(a.body)}</p>
              <p style="color:var(--paper-dim); font-size:11px;">${new Date(a.created_at).toLocaleString()}</p>
            </div>`).join('')
        : `<p style="color:var(--paper-dim);">${T({fa:'اطلاعیه‌ای ثبت نشده — همه‌چیز روال عادی داره.', en:'No announcements — everything is running normally.', ar:'لا توجد إعلانات — كل شيء يعمل بشكل طبيعي.', tr:'Duyuru yok — her şey normal çalışıyor.', ru:'Объявлений нет — всё работает в обычном режиме.', es:'Sin anuncios — todo funciona con normalidad.', ku:'هیچ ئاگادارییەک نییە — هەموو شت بە ئاسایی کاردەکات.'})}</p>`;
    } catch (err) {
      bannerEl.className = 'status-banner down';
      bannerEl.innerHTML = `<span class="status-dot"></span><span>${T({fa:'در حال حاضر نمی‌تونیم وضعیت رو بررسی کنیم', en:'Unable to check status right now', ar:'تعذر التحقق من الحالة الآن', tr:'Şu anda durum kontrol edilemiyor', ru:'Не удаётся проверить статус сейчас', es:'No se puede comprobar el estado ahora', ku:'ئێستا ناتوانین دۆخ بپشکنین'})}</span>`;
      listEl.innerHTML = '';
    }
  })();
</script>
