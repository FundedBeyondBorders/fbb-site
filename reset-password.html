<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<script>
  // Sets the correct lang/dir BEFORE the browser paints anything — without
  // this, a returning visitor who chose a non-Persian language would see
  // a jarring flash of Persian/RTL layout on every page load/refresh,
  // then a disruptive jump to their actual language once js/i18n.js loads
  // later in the page. Mirrors i18n.js's own RTL_LANGS list exactly.
  (function() {
    var lang = localStorage.getItem('fbb_lang') || 'en';
    document.documentElement.lang = lang;
    document.documentElement.dir = ['fa', 'ar', 'ku'].includes(lang) ? 'rtl' : 'ltr';
  })();
</script>
<meta name="referrer" content="no-referrer">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#C89B3C">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FBB">
<meta name="mobile-web-app-capable" content="yes">
<title data-i18n="title_home">FundedBeyondBorders | Trading Evaluation, Without Borders</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<nav>
  <div class="wrap row">
    <a href="index.html" class="logo">
      <span class="logo-mark"><svg aria-hidden="true" viewBox="0 0 40 40" fill="none"><path d="M4 34V20C4 11 11 4 20 4C29 4 36 11 36 20V34" stroke="#C89B3C" stroke-width="2.4"/><path d="M12 34V22C12 15.4 15.6 12 20 12C24.4 12 28 15.4 28 22V34" stroke="#2C8C99" stroke-width="2.4"/></svg></span>
      <span data-i18n="brand_name">FundedBeyondBorders</span>
    </a>
  </div>
</nav>

<div id="main-content" class="wrap" style="max-width:420px; margin:80px auto;">
  <div class="card">
    <h1 style="margin-bottom:16px;" data-i18n="reset_pw_h1">Set a new password</h1>

    <div id="resetForm">
      <div class="field">
        <label data-i18n="reset_pw_new" for="newPassword">رمز عبور جدید (حداقل ۸ کاراکتر)</label>
        <input type="password" id="newPassword" required autocomplete="new-password" minlength="8">
      </div>
      <div class="field">
        <label data-i18n="reset_pw_confirm" for="confirmPassword">تکرار رمز عبور جدید</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="8">
      </div>
      <button class="btn btn-primary btn-block" id="submitResetBtn" data-i18n="reset_pw_submit">Set new password</button>
    </div>
    <p id="resetMsg" style="margin-top:14px; font-size:13.5px;"></p>
    <a href="auth.html" class="btn btn-ghost btn-block" style="margin-top:14px; display:none;" id="goToLoginBtn" data-i18n="auth_login_title">Log In</a>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/pwa.js"></script>
<script src="js/api.js"></script>
<script src="js/settings.js"></script>
<script>
  const token = new URLSearchParams(location.search).get('token');
  const isFa = () => (localStorage.getItem('fbb_lang') || 'fa') === 'fa';
  function T(dict) { return dict[localStorage.getItem('fbb_lang') || 'fa'] ?? dict.en; }

  if (!token) {
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('resetMsg').style.color = 'var(--red)';
    document.getElementById('resetMsg').textContent = T({fa:'لینک نامعتبره — دوباره از صفحه‌ی ورود درخواست بده.', en:'Invalid link — request a new one from the login page.', ar:'رابط غير صالح — اطلب رابطاً جديداً من صفحة تسجيل الدخول.', tr:'Geçersiz bağlantı — giriş sayfasından yeni bir tane iste.', ru:'Недействительная ссылка — запросите новую со страницы входа.', es:'Enlace inválido — solicita uno nuevo desde la página de inicio de sesión.', ku:'لینکی نادروستە — لە پەڕەی چوونەژوورەوە یەکی نوێ داوا بکە.'});
  }

  document.getElementById('submitResetBtn').addEventListener('click', async () => {
    const msgEl = document.getElementById('resetMsg');
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (newPassword !== confirmPassword) {
      msgEl.style.color = 'var(--red)';
      msgEl.textContent = T({fa:'رمزهای عبور یکسان نیستن.', en:"Passwords don't match.", ar:'كلمتا المرور غير متطابقتين.', tr:'Şifreler eşleşmiyor.', ru:'Пароли не совпадают.', es:'Las contraseñas no coinciden.', ku:'وشە نهێنییەکان یەکسان نین.'});
      return;
    }
    try {
      const result = await apiPost('/auth/reset-password', { token, new_password: newPassword });
      document.getElementById('resetForm').style.display = 'none';
      msgEl.style.color = 'var(--green)';
      msgEl.textContent = result.message;
      document.getElementById('goToLoginBtn').style.display = 'block';
    } catch (err) {
      msgEl.style.color = 'var(--red)';
      msgEl.textContent = err.message;
    }
  });
</script>
</body>
</html>
